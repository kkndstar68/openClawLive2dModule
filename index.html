<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D 浮窗</title>
    <!-- Cubism 4 Core -->
    <script src="/live2dcubismcore.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
      /* 浮窗拖拽条：仅 Electron 下可拖拽窗口 */
      #electron-drag {
        position: fixed; top: 0; left: 0; right: 0; height: 32px;
        -webkit-app-region: drag;
        z-index: 100;
        display: flex; align-items: center; justify-content: flex-end;
        padding: 0 8px;
      }
      #electron-drag .btn {
        -webkit-app-region: no-drag;
        width: 24px; height: 24px; border: none; border-radius: 4px;
        cursor: pointer; font-size: 14px; line-height: 1;
        background: rgba(0,0,0,0.25); color: #fff;
        margin-left: 4px;
      }
      #electron-drag .btn:hover { background: rgba(0,0,0,0.5); }
      #electron-drag .btn.close:hover { background: #e74c3c; }
      /* 非 Electron 时隐藏拖拽条 */
      body:not(.electron) #electron-drag { display: none; }
    </style>
  </head>
  <body>
    <div id="electron-drag">
      <button type="button" class="btn minimize" title="最小化" aria-label="最小化">−</button>
      <button type="button" class="btn close" title="关闭" aria-label="关闭">×</button>
    </div>

    <canvas id="canvas" style="position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none;"></canvas>

    <div style="position: absolute; bottom: 16px; left: 0; right: 0; z-index: 10; text-align: center; pointer-events: none;">
      <div style="display: inline-flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: auto; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); color: #fff; max-width: 420px; margin: 0 auto; -webkit-app-region: no-drag;">
        <!-- 聊天记录展示区 -->
        <div id="chatLog" style="width: 100%; height: 150px; overflow-y: auto; padding: 8px; border-radius: 6px; background: rgba(0,0,0,0.2); margin-bottom: 8px; -webkit-app-region: no-drag;">
          <div style="text-align: left; font-size: 14px; line-height: 1.4;">
            <!-- 聊天记录将在这里显示 -->
          </div>
        </div>
        
        <div style="display: inline-flex; gap: 8px; align-items: center; width: 100%; justify-content: center;">
          <label for="modelSelect">模型:</label>
          <select id="modelSelect" style="max-width: 220px; padding: 2px 6px; border-radius: 4px; border: none; outline: none; -webkit-app-region: no-drag;">
            <option>加载中...</option>
          </select>
        </div>
        <div style="display: inline-flex; gap: 8px; align-items: center; width: 100%; justify-content: center;">
          <label for="soundSelect">音频:</label>
          <select id="soundSelect" style="max-width: 220px; padding: 2px 6px; border-radius: 4px; border: none; outline: none; -webkit-app-region: no-drag;">
            <option>暂无音频</option>
          </select>
          <button id="soundTestBtn" style="padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; -webkit-app-region: no-drag;">声音测试</button>
        </div>
        <div style="display: inline-flex; gap: 8px; align-items: center; width: 100%; justify-content: center; margin-top: 8px;">
          <button id="localAudioTestBtn" style="padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; -webkit-app-region: no-drag;">播放本地语音测试口型</button>
        </div>
        <div style="display: inline-flex; gap: 8px; align-items: center; width: 100%; justify-content: center; margin-top: 8px;">
          <label for="voiceSelect">语音:</label>
          <select id="voiceSelect" style="max-width: 220px; padding: 2px 6px; border-radius: 4px; border: none; outline: none; -webkit-app-region: no-drag;">
            <option value="zh-CN-XiaoxiaoNeural">晓晓 (甜美)</option>
            <option value="zh-CN-YunxiNeural">云希 (温柔)</option>
            <option value="zh-CN-YunxiaNeural">云霞 (成熟)</option>
            <option value="zh-CN-YunyangNeural">云阳 (活泼)</option>
          </select>
        </div>

        
        <!-- 聊天交互区 -->
        <div style="display: flex; gap: 8px; align-items: center; width: 100%; margin-top: 8px; -webkit-app-region: no-drag;">
          <input id="chatInput" type="text" placeholder="和看板娘聊聊..." style="flex: 0.7; padding: 6px 10px; border-radius: 6px; border: none; outline: none; background: rgba(255,255,255,0.1); color: #fff; -webkit-app-region: no-drag;">
          <button id="voiceBtn" style="flex: 0.15; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; -webkit-app-region: no-drag;">按住说话</button>
          <button id="sendBtn" style="flex: 0.15; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; -webkit-app-region: no-drag;">发送</button>
        </div>
        <div style="display: inline-flex; gap: 8px; align-items: center; width: 100%; justify-content: center; margin-top: 8px;">
          <button id="editBtn" style="padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; -webkit-app-region: no-drag;">编辑动作和表情</button>
        </div>
        
        <!-- 编辑界面弹窗 -->
        <div id="editModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; -webkit-app-region: no-drag;">
          <div style="background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-radius: 12px; padding: 20px; width: 400px; max-width: 90%; -webkit-app-region: no-drag;">
            <h3 style="color: #fff; margin-bottom: 20px; text-align: center;">编辑动作和表情</h3>
            
            <div style="margin-bottom: 15px;">
              <label style="display: block; color: #fff; margin-bottom: 5px;">表情选择:</label>
              <select id="faceSelect" style="width: 100%; padding: 8px; border-radius: 6px; border: none; outline: none; background: rgba(255,255,255,0.1); color: #fff; -webkit-app-region: no-drag;">
                <option value="">加载中...</option>
              </select>
            </div>
            
            <div style="margin-bottom: 20px;">
              <label style="display: block; color: #fff; margin-bottom: 5px;">动作选择:</label>
              <select id="actionSelect" style="width: 100%; padding: 8px; border-radius: 6px; border: none; outline: none; background: rgba(255,255,255,0.1); color: #fff; -webkit-app-region: no-drag;">
                <option value="">加载中...</option>
              </select>
            </div>
            
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
              <button id="cancelBtn" style="padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; background: rgba(255,255,255,0.2); color: #fff; -webkit-app-region: no-drag;">取消</button>
              <button id="saveBtn" style="padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; background: rgba(0,122,255,0.6); color: #fff; -webkit-app-region: no-drag;">保存</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      if (typeof window.electronAPI !== 'undefined') {
        document.body.classList.add('electron');
        document.querySelector('#electron-drag .close').onclick = () => window.electronAPI.close();
        document.querySelector('#electron-drag .minimize').onclick = () => window.electronAPI.minimize();
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
